name: 手动构建简体中文 Studio（不部署）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/studio-zh-cn
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: 下载固定版本并应用汉化
        run: python3 scripts/manage.py prepare
      - name: 构建中文 Studio 镜像
        run: python3 scripts/manage.py build
      - name: 保存不含运行数据与密钥的汉化报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-zh-cn-localization-report
          path: tools/studio-zh-cn/.upstream/supabase/.studio-localization/report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
